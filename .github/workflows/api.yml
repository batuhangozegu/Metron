name: api

on:
  push:
    branches: [main]
    paths: ["api/**", "proto/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "proto/**", ".github/workflows/api.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            api/tools/go.sum
      - run: go generate ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
