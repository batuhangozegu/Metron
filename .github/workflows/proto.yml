name: proto

on:
  push:
    branches: [main]
    paths: ["proto/**", ".github/workflows/proto.yml"]
  pull_request:
    paths: ["proto/**", ".github/workflows/proto.yml"]

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lint and format on every run; on pull requests also checks for
      # breaking changes against main.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.47.2
          input: proto
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=proto"
          push: false
