# Local development stack for Metron.
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/compose.yaml up -d --build   (or: task up)
#
# Ports bind to 127.0.0.1 only; nothing is exposed beyond this machine.
# Postgres uses 5433 so it does not clash with a locally installed Postgres.

name: metron

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metron}
      POSTGRES_USER: ${POSTGRES_USER:-metron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Latest prices and pub/sub events are rebuilt from the feed on restart,
    # so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metron}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-metron}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Rust risk engine. Inside the network the API reaches it as engine:9090.
  engine:
    build:
      context: ..
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-metron}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-metron}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-}
      MARKET_SYNC_SECONDS: ${MARKET_SYNC_SECONDS:-900}
      LARGE_CAP_MIN_DAILY_VOLUME: ${LARGE_CAP_MIN_DAILY_VOLUME:-10000000}
      BINANCE_REST_URL: ${BINANCE_REST_URL:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://data-stream.binance.vision}
    ports:
      - "127.0.0.1:${ENGINE_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Go API gateway; GET /healthz shows whether it can reach the engine.
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ENGINE_ADDR: engine:9090
      DATABASE_URL: postgres://${POSTGRES_USER:-metron}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-metron}?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      engine:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      METRON_API_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
