<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metron mobile markets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{--bg:#0D1012;--surface:#14181B;--raised:#1B2125;--line:#2A3238;--text:#E9EDEF;--muted:#A3AEB5;--subtle:#86929A;--inverse:#0D1012;--profit:#3FCF8E;--loss:#F47C7C;--safe:#6CB6FF;--caution:#F2B84B;--limit:#E879F9;--safe-t:rgba(108,182,255,.12);--caution-t:rgba(242,184,75,.12);--limit-t:rgba(232,121,249,.12);font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.m[data-theme="light"]{--bg:#F3F5F6;--surface:#FFFFFF;--raised:#ECEFF1;--line:#D3D9DD;--text:#12171A;--muted:#4A565E;--subtle:#5F6B73;--inverse:#FFFFFF;--profit:#0B7446;--loss:#BF2F38;--safe:#1B66B5;--caution:#8A5A00;--limit:#9A1FA8;--safe-t:rgba(27,102,181,.10);--caution-t:rgba(214,150,20,.16);--limit-t:rgba(154,31,168,.10)}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="m" data-theme="{{theme}}" style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Markets</h1>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--safe)"></span>Live</span>
</header>

<main style="flex: 1; min-height: 0; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column">
<label for="mm-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search pairs</label>
<input id="mm-search" type="search" placeholder="Search pairs" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 400 15px Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%">
</div>

<div role="group" aria-label="Coin class" style="display: flex; gap: 6px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--text); background: var(--text); color: var(--inverse); font: 500 13px Inter, system-ui, sans-serif">All</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 13px Inter, system-ui, sans-serif">BTC/ETH</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 13px Inter, system-ui, sans-serif">Large-cap</button>
<button type="button" aria-pressed="false" style="flex: none; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 13px Inter, system-ui, sans-serif">Small-cap</button>
</div>

<ul style="list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<li style="border-top: {{r.border}}">
<a href="MobileCheck.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; align-items: center; gap: 12px; padding: 12px 16px; min-height: 44px">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600">{{r.pair}}</span>
<span style="font-size: 12px; color: var(--subtle)">{{r.cls}} · stop <span class="num">{{r.stop}}</span></span>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="height: 5px; border-radius: 2px; background: var(--raised); display: block"><span style="display: block; height: 5px; border-radius: 2px; background: var(--muted); width: {{r.atrFill}}"></span></span>
<span class="num" style="font-size: 11px; color: var(--subtle)">ATR {{r.atr}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
<span class="num" style="font-size: 15px">{{r.price}}</span>
<span class="num" style="font-size: 12px; color: {{r.chColor}}">{{r.change}}</span>
</span>
</a>
</li>
</sc-for>
</ul>
<p style="margin: 0; font-size: 12px; line-height: 17px; color: var(--subtle)">The bar shows daily movement from 0 to 10%. Tap a pair to check a trade.</p>
</main>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--surface); padding: 6px 8px 10px">
<a href="MobileHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 11px; color: var(--muted)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 15a8 8 0 0116 0M11 15l4-5"/></svg>
Risk
</a>
<a href="MobileMarkets.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 11px; font-weight: 600; color: var(--text)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h14M4 11h14M4 16h14"/></svg>
Markets
</a>
<a href="MobileAlerts.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 11px; color: var(--muted)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 16V10a5.5 5.5 0 0111 0v6l1.5 1.5H4L5.5 16zM9.5 19.5h3"/></svg>
Alerts
</a>
<a href="MobileRules.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; font-size: 11px; color: var(--muted)">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h8M16 7h2M4 15h2M10 15h8"/><circle cx="14" cy="7" r="2"/><circle cx="8" cy="15" r="2"/></svg>
Rules
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const up = 'var(--profit)';
const down = 'var(--loss)';
const line = '1px solid var(--line)';
return {
theme: this.props.theme ?? 'dark',
rows: [
{ pair: 'BTC/USDT', cls: 'BTC/ETH', price: '97,846.00', change: '▲ +1.42%', chColor: up, atr: '2.0%', atrFill: '20%', stop: '3.0%', border: '0' },
{ pair: 'ETH/USDT', cls: 'BTC/ETH', price: '3,461.04', change: '▲ +0.86%', chColor: up, atr: '2.8%', atrFill: '28%', stop: '4.2%', border: line },
{ pair: 'SOL/USDT', cls: 'Large-cap', price: '178.75', change: '▼ −2.10%', chColor: down, atr: '4.5%', atrFill: '45%', stop: '6.75%', border: line },
{ pair: 'BNB/USDT', cls: 'Large-cap', price: '642.30', change: '▲ +0.31%', chColor: up, atr: '2.4%', atrFill: '24%', stop: '3.6%', border: line },
{ pair: 'XRP/USDT', cls: 'Large-cap', price: '1.124', change: '▼ −0.74%', chColor: down, atr: '5.1%', atrFill: '51%', stop: '7.65%', border: line },
{ pair: 'LINK/USDT', cls: 'Large-cap', price: '14.82', change: '▲ +2.95%', chColor: up, atr: '5.4%', atrFill: '54%', stop: '8.1%', border: line },
{ pair: 'AVAX/USDT', cls: 'Large-cap', price: '34.16', change: '▼ −3.40%', chColor: down, atr: '6.2%', atrFill: '62%', stop: '9.3%', border: line },
{ pair: 'PENDLE/USDT', cls: 'Small-cap', price: '5.204', change: '▲ +4.12%', chColor: up, atr: '8.0%', atrFill: '80%', stop: '12.0%', border: line },
{ pair: 'INJ/USDT', cls: 'Small-cap', price: '22.47', change: '▼ −1.88%', chColor: down, atr: '7.4%', atrFill: '74%', stop: '11.1%', border: line }
]
};
}
}
</script>
</body>
</html>
