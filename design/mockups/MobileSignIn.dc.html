<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metron mobile sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.m{--bg:#0D1012;--surface:#14181B;--raised:#1B2125;--line:#2A3238;--text:#E9EDEF;--muted:#A3AEB5;--subtle:#86929A;--inverse:#0D1012;--profit:#3FCF8E;--loss:#F47C7C;--safe:#6CB6FF;--caution:#F2B84B;--limit:#E879F9;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.m[data-theme="light"]{--bg:#F3F5F6;--surface:#FFFFFF;--raised:#ECEFF1;--line:#D3D9DD;--text:#12171A;--muted:#4A565E;--subtle:#5F6B73;--inverse:#FFFFFF;--profit:#0B7446;--loss:#BF2F38;--safe:#1B66B5;--caution:#8A5A00;--limit:#9A1FA8}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="m" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 72px 24px 32px; gap: 40px">

<div style="display: flex; flex-direction: column; gap: 20px">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 16h18M2 16V7M6.5 16v-4M11 16V7M15.5 16v-4M20 16V7"/></svg>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em">Metron</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Measure the risk before every order.</p>
</div>
</div>

<sc-if value="{{isSignIn}}" hint-placeholder-val="{{ true }}">
<form aria-label="Sign in" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="si-email" style="font-size: 13px; color: var(--muted)">Email</label>
<input id="si-email" type="email" autocomplete="email" style="height: 52px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 400 16px Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="si-pass" style="font-size: 13px; color: var(--muted)">Password</label>
<input id="si-pass" type="password" autocomplete="current-password" style="height: 52px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 400 16px Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%">
</div>
<button type="button" style="height: 52px; margin-top: 8px; border: 0; border-radius: 10px; background: var(--text); color: var(--inverse); font: 600 16px Inter, system-ui, sans-serif">Sign in</button>
<button type="button" style="height: 48px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); font: 500 15px Inter, system-ui, sans-serif">Create an account</button>
<p style="margin: 0; font-size: 13px; line-height: 19px; text-align: center; color: var(--subtle)">A new account starts with a paper balance. No real money moves until you connect an exchange.</p>
</form>
</sc-if>

<sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
<form aria-label="Two-factor code" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Two-factor code</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted)">Enter the six digits from your authenticator app.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="si-code" style="font-size: 13px; color: var(--muted)">Code</label>
<input id="si-code" class="num" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="height: 64px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 30px; letter-spacing: 0.35em; text-align: center; box-sizing: border-box; width: 100%">
</div>
<button type="button" style="height: 52px; margin-top: 8px; border: 0; border-radius: 10px; background: var(--text); color: var(--inverse); font: 600 16px Inter, system-ui, sans-serif">Verify</button>
<button type="button" style="height: 48px; border: 0; background: transparent; color: var(--muted); font: 500 15px Inter, system-ui, sans-serif; text-decoration: underline">Use a recovery code</button>
</form>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"step":{"editor":"enum","options":["sign-in","code"],"default":"sign-in"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const step = this.props.step ?? 'sign-in';
return { theme: this.props.theme ?? 'dark', isSignIn: step === 'sign-in', isCode: step === 'code' };
}
}
</script>
</body>
</html>
