[package]
name = "metron-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.6"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
