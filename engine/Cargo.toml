[package]
name = "metron-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
prost = "0.14.6"
redis = { version = "1.8.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "rust_decimal", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
